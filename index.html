<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TECN MATEHUALA · Talleres</title>
<style>
:root{--bg:#F1FAEE;--card:#fff;--txt:#1B1B2F;--mut:#5B6475;--pri:#1D3557;--on:#fff;--acc:#2EC4B6;--ok:#17857B;--warn:#8A4B08;--bad:#B42318;--line:#CFE3DD;--chip:#E3F4F0;padding-top:env(safe-area-inset-top,0)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0F1726;--card:#172236;--txt:#E8EEF7;--mut:#A8B3C7;--pri:#2EC4B6;--on:#0B1220;--ok:#5FD8CB;--warn:#F0B35E;--bad:#FF8A80;--line:#2B3A55;--chip:#1E3048}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:var(--pri);color:var(--on);padding:12px 16px}
.top,main{max-width:980px;margin:auto}.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.top img{height:42px;background:#fff;border-radius:8px;padding:3px;margin-right:6px}
main{padding:16px}h2{font-size:18px;margin:4px 0 12px}h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.between{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}.err{color:var(--bad);font-size:13px}
.btn,.chip{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--pri);min-height:38px;padding:7px 14px;background:var(--pri);color:var(--on)}
.btn.sec,.chip{background:transparent;color:var(--pri)}.chip{border-radius:999px;min-height:32px;padding:3px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--pri);color:var(--on)}.btn:disabled{opacity:.45;cursor:not-allowed}
label{display:block;font-size:13px;font-weight:600;margin-top:10px}
input,select{width:100%;min-height:40px;padding:8px 10px;margin-top:3px;border:1px solid var(--mut);border-radius:8px;font:inherit;background:var(--card);color:var(--txt)}
input[type=checkbox]{width:22px;min-height:22px}#role{width:auto;border-radius:999px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ok)}.tag.lleno{color:var(--bad)}.tag.espera{color:var(--warn)}
.note{background:var(--chip);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px;margin:10px 0}.note.bad{border-color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:13.5px}dt{color:var(--mut)}dd{margin:0}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--pri);color:var(--on);padding:10px 16px;border-radius:10px;z-index:9}
.doc{background:#fff;color:#111;border:2px solid #1D3557;border-radius:6px;padding:26px 22px;margin:12px 0;font-family:Georgia,serif;text-align:center}
.doc .big{font-size:22px;font-weight:700;margin:10px 0}.doc p{margin:8px 0}.doc .sign{margin:44px auto 0;width:60%;border-top:1px solid #111;padding-top:4px}.doc small{display:block;margin-top:22px;color:#444}
@media print{header,.noprint,.toast{display:none!important}body{background:#fff}.doc{margin:0}}
</style>
</head>
<body>
<header><div class="top">
<div class="row"><img src="logo-tec.png.jfif" alt="" onerror="this.remove()"><img src="logo-tecnm.png" alt="" onerror="this.remove()"><b>TECN MATEHUALA</b></div>
<select id="role" data-s="role" aria-label="Rol"><option value="alumno">Alumno</option><option value="jefatura">Jefatura</option><option value="entrenador">Entrenador</option><option value="medicina">Medicina</option></select>
</div></header>
<main id="app"></main>
<script>
/* ===== 1. CONFIGURACIÓN ===== API: dirección del Apps Script (la hoja es la base de datos). */
const API="https://script.google.com/macros/s/AKfycbyPiKyljZWYCyscnDJj0OzdG244rW-Ggh8N7ov6HV4jatS5ndXUbsJlTGhp5F6EusLYPg/exec";
const SLOTS={"":"Ninguno","LM":"Lun y Mié por la tarde","MJ":"Mar y Jue por la tarde","V":"Viernes por la tarde","AM":"Mañanas"};
const TYPES=["Todos","Deportivo","Cívico","Cultural"];
// STAFF: roles con contraseña; comparten pantalla de entrada, cambia solo la acción de la hoja.
const STAFF={jefatura:{act:"jefa",title:"Panel de la jefatura",label:"Contraseña de jefatura"},
 entrenador:{act:"ent",title:"Mi taller (entrenador)",label:"Contraseña del taller"},
 medicina:{act:"med",title:"Expediente médico",label:"Contraseña de medicina"}};

/* ===== 2. ESTADO ===== */
let W=[];       // talleres
let me=null;    // alumno con sesión: {c, nip, p: perfil, mis: inscripciones}
const staff={}; // sesión de cada rol de personal: {clave, t, data}
const S={role:"alumno",view:"catalog",type:"Todos",slot:"",q:"",sq:"",wf:"",open:true,goal:50,school:"",
 pick:null,after:"catalog",err:{},f:{hrs:"1"},att:{},done:null,cert:null,expMsg:null,ready:false,fail:false,wait:false};

/* ===== 3. UTILIDADES ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shop=id=>W.find(w=>w.id===id)||{n:"(taller)",h:"",t:""};
const card=h=>`<div class="card">${h}</div>`;
const pct=(a,b)=>Math.min(100,a/b*100);
const phoneOk=t=>/^\d{10}$/.test(t||"");
function status(w){switch(true){case w.ins>=w.c:return["lleno","Lleno"];case w.ins<w.m:return["espera","En espera: pocos inscritos"];default:return["abierto","Abierto"]}}
function medLine(e){if(!e.med)return"—";const m=e.med,x=[m.cond,m.alergias&&"Alergia: "+m.alergias,m.meds&&"Med.: "+m.meds].filter(v=>v&&!/^ninguna?$/i.test(v));return esc(m.folio)+" · "+esc(x.join("; ")||"Sin condiciones")}
// fld: campo de texto; data-f guarda lo escrito en S.f[k].
const fld=(k,lb,type="text",hint="",ac="")=>`<label>${lb}<input data-f="${k}" type="${type}" placeholder="${hint}" value="${esc(S.f[k]||"")}"${ac?` autocomplete="${ac}"`:""}></label>${S.err[k]?`<div class="err">${esc(S.err[k])}</div>`:""}`;
function toast(m,keep){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t.h);if(!keep)t.h=setTimeout(()=>t.hidden=true,2600)}
const hideToast=()=>{const t=$(".toast");if(t)t.hidden=true};

/* ===== 4. API: una sola función para hablar con la hoja ===== */
async function call(a,d,msg){
 if(msg){S.wait=true;toast(msg+"…",true)}
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),30000);
 try{const r=await fetch(API,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a,...d})});return await r.json()}
 catch(e){return{ok:false,msg:e.name==="AbortError"?"La hoja tardó demasiado. Intenta de nuevo.":"Sin conexión con la hoja."}}
 finally{clearTimeout(timer);if(msg){S.wait=false;hideToast()}}}
async function pullStaff(role){const s=staff[role];if(!s)return;
 const r=await call(STAFF[role].act,{clave:s.clave,t:s.t});if(r.ok)s.data=r.insc||r.regs}
async function load(){
 const r=await call("estado");
 if(!r.ok){S.fail=true;return S.ready||draw()}
 Object.assign(S,{fail:false,ready:true,open:r.abierto,goal:r.meta||50,school:r.inst||""});W=r.talleres;
 await pullStaff(S.role);
 if(!["INPUT","SELECT"].includes(document.activeElement.tagName))draw()}

/* ===== 5. VISTAS DEL ALUMNO ===== */
function student(){switch(S.view){
 case"login":return login();
 case"form":if(me)return enroll();break;
 case"done":if(me)return receipt();break;
 case"mine":if(me)return mine();break;
 case"cert":if(S.cert)return certificate();break}
 return catalog()}

function catalog(){
 if(!S.ready)return card(S.fail?'No se pudo conectar. <button class="btn sec" data-a="retry">Reintentar</button>':"Cargando talleres…");
 const q=S.q.toLowerCase(),list=W.filter(w=>(S.type==="Todos"||w.t===S.type)&&(!S.slot||w.s!==S.slot)&&w.n.toLowerCase().includes(q));
 const top=me?`<span>Hola, <b>${esc(me.p.n)}</b> · ${esc(me.c)}</span><span class="row"><button class="btn sec" data-a="mine">Mi inscripción</button><button class="btn sec" data-a="logout">Salir</button></span>`
  :`<span class="mut">Para inscribirte entra con tu número de control y NIP.</span><button class="btn" data-a="gologin">Entrar</button>`;
 return `<h2>Talleres disponibles</h2>${card(`<div class="row between">${top}</div>`)}
 <input data-live="q" placeholder="Buscar taller" value="${esc(S.q)}">
 <div class="row" style="margin:8px 0">${TYPES.map(t=>`<button class="chip" data-a="type" data-v="${t}" aria-pressed="${S.type===t}">${t}</button>`).join("")}</div>
 <label>¿En qué horario tienes clases?<select data-s="slot">${Object.entries(SLOTS).map(([k,v])=>`<option value="${k}"${S.slot===k?" selected":""}>${v}</option>`).join("")}</select></label>
 ${S.open?"":'<div class="note bad">Las inscripciones están cerradas. Consulta con Extraescolares.</div>'}
 <h3>${list.length} talleres</h3><div class="grid">${list.map(w=>{const[k,tx]=status(w),ya=me&&me.mis.some(m=>m.t===w.id);
  return card(`<b>${esc(w.n)}</b> <span class="mut">· ${esc(w.t)}</span><div class="mut">${esc(w.h)}</div><div class="bar"><i style="width:${pct(w.ins,w.c)}%"></i></div><div class="mut">${w.ins} de ${w.c} lugares</div><p><span class="tag ${k}">${tx}</span></p><button class="btn" data-a="pick" data-v="${w.id}"${!S.open||k==="lleno"||ya?" disabled":""}>${ya?"Ya inscrito":"Inscribirme"}</button>`)}).join("")||card("Ningún taller cumple el filtro.")}</div>`}

const back='<button class="btn sec" data-a="back">← Talleres</button>';
function login(){return `${back}<h2 style="margin-top:12px">Entrar como alumno</h2>${card(`<p class="mut">Usa tu número de control y el NIP que te dio Extraescolares.</p>${fld("lc","Número de control","text","8 dígitos","username")}${fld("ln","NIP","password","","current-password")}<p><button class="btn" data-enter data-a="login">Entrar</button></p>`)}`}

const expBlock=()=>`<h3>Expediente médico (opcional)</h3><p class="mut">Escribe el número que te dieron en Servicios Médicos. Tu entrenador y la jefatura verán solo lo necesario para cuidarte.</p>${fld("exp","Número de expediente","text","Ej.: EXP-0001","off")}<p><button class="btn sec" data-a="verify">Verificar expediente</button></p>${S.expMsg?`<div class="note${S.expMsg.ok?"":" bad"}">${esc(S.expMsg.msg)}</div>`:""}`;

function enroll(){const w=shop(S.pick),p=me.p,other=me.mis.some(m=>m.t!==S.pick);
 return `${back}<h2 style="margin-top:12px">Inscripción: ${esc(w.n)}</h2><p class="mut">${esc(w.t)} · ${esc(w.h)}</p>
 ${card(`<b>${esc(p.n)}</b> · ${esc(me.c)}
 ${p.sem?"":`<label>Semestre<select data-f="sem"><option value="">Elige uno</option>${[1,2,3,4,5,6,7,8,9].map(n=>`<option${S.f.sem==n?" selected":""}>${n}</option>`).join("")}</select></label>${S.err.sem?`<div class="err">${S.err.sem}</div>`:""}`}
 ${p.x?"":`<label>Sexo<select data-f="x"><option value="">Elige uno</option><option value="M"${S.f.x==="M"?" selected":""}>Mujer</option><option value="H"${S.f.x==="H"?" selected":""}>Hombre</option></select></label>${S.err.x?`<div class="err">${S.err.x}</div>`:""}`}
 ${fld("tel","Teléfono (para el grupo de WhatsApp)","tel","10 dígitos","tel")}${expBlock()}
 ${other?'<div class="note bad">Ya estás inscrito en otro taller. Solo recibirás un crédito.</div>':""}
 <p><button class="btn" data-a="send">Confirmar inscripción</button></p>`)}`}

const logos='<p><img src="logo-tec.png.jfif" height="60" alt="" onerror="this.remove()"> <img src="logo-tecnm.png" height="60" alt="" onerror="this.remove()"></p>';
function receipt(){const d=S.done,w=shop(d.t);
 return `<div class="note noprint">¡Listo! Quedaste inscrito.</div>
 <div class="doc">${logos}<h3>Comprobante de inscripción</h3><p>${esc(S.school)}</p><p>Se registró la inscripción de</p><div class="big">${esc(me.p.n)}</div><p>con número de control <b>${esc(me.c)}</b>, en el taller</p><div class="big">${esc(w.n)}</div><p>${esc(w.t)} · ${esc(w.h)}</p><small>Fecha: ${esc(d.fecha)} · Conserva este comprobante.</small></div>
 ${card(`<div class="row noprint"><button class="btn" data-a="print">Imprimir / guardar PDF</button><button class="btn sec" data-a="mine">Mi inscripción</button><button class="btn sec" data-a="back">Ver talleres</button></div>
 <label>¿Quieres cambiarte de taller?<select data-f="chg">${W.filter(x=>x.id!==d.t&&!me.mis.some(m=>m.t===x.id)).map(x=>`<option value="${x.id}">${esc(x.n)} (${x.ins}/${x.c})</option>`).join("")}</select></label>
 <p><button class="btn sec" data-a="change"${S.open?"":" disabled"}>Cambiar de taller</button></p>`)}`}

function mine(){
 const list=me.mis.map(m=>{const w=shop(m.t),ok=m.h>=S.goal;
  return card(`<b>${esc(w.n)}</b><br>${esc(w.h)}<br><span class="mut">Horas: ${m.h} de ${S.goal}</span><div class="bar"><i style="width:${pct(m.h,S.goal)}%"></i></div>${ok?`<span class="tag">Cumples las ${S.goal} horas</span> <button class="btn" data-a="cert" data-v="${m.t}">Descargar constancia</button>`:""}`)}).join("");
 return `${back}<h2 style="margin-top:12px">Mi inscripción</h2><p class="mut">${esc(me.p.n)} · ${esc(me.c)}</p>${list||'<div class="note bad">Todavía no tienes inscripciones.</div>'}
 ${card(`<h3 style="margin-top:0">Mis datos de contacto y expediente</h3>${fld("tel","Teléfono","tel","10 dígitos","tel")}${expBlock()}<p><button class="btn" data-a="saveContact">Guardar</button></p>`)}`}

function certificate(){const d=S.cert;
 return `<div class="row noprint"><button class="btn sec" data-a="mine">← Mi inscripción</button><button class="btn" data-a="print">Imprimir / guardar PDF</button></div>
 <div class="doc">${logos}<h3>${esc(d.inst||"TalTec")}</h3><p>Actividades extraescolares</p><div class="big">CONSTANCIA</div><p>Se hace constar que</p><div class="big">${esc(d.nombre)}</div>
 <p>con número de control <b>${esc(d.c)}</b>, cumplió satisfactoriamente <b>${d.horas} horas</b> (mínimo: ${d.meta}) en el taller <b>${esc(d.taller)}</b> (${esc(d.tipo)}).</p><p>Se expide el ${esc(d.fecha)}.</p>
 <div class="sign">${esc(d.resp||"Jefatura de Extraescolares")}<br><small style="margin:0">Jefatura de Extraescolares</small></div><small>Folio: <b>${esc(d.folio)}</b></small></div>`}

/* ===== 6. VISTAS DEL PERSONAL (jefatura, entrenador, medicina) ===== */
function staffView(){const cfg=STAFF[S.role],s=staff[S.role];
 if(!s){const pick=S.role==="entrenador"?`<label>Taller<select data-f="t">${W.map(w=>`<option value="${w.id}"${S.f.t==w.id?" selected":""}>${esc(w.n)}</option>`).join("")}</select></label>`:"";
  return `<h2>${cfg.title}</h2>${card(`${pick}${fld("key",cfg.label,"password","","current-password")}<p><button class="btn" data-enter data-a="slogin">Entrar</button></p>`)}`}
 return `<div class="row between"><h2>${cfg.title}</h2><button class="btn sec" data-a="slogout">Salir</button></div>`+({jefatura:adminBody,entrenador:coachBody,medicina:doctorBody}[S.role])(s)}

function adminBody(s){
 const L=s.data.filter(e=>(!S.wf||e.t==S.wf)&&e.c.includes(S.sq));
 return `${card(`<div class="row between"><span>Inscripciones y cambios: <b>${S.open?"abiertos":"cerrados"}</b></span><button class="btn${S.open?"":" sec"}" data-a="period">${S.open?"Cerrar periodo":"Reabrir periodo"}</button></div>`)}
 <h3>Talleres</h3>${card(`<div class="tw"><table><tr><th>Taller</th><th>Inscritos</th><th>Cupo</th><th>Estado</th></tr>${W.map(w=>{const[k,tx]=status(w);return `<tr><td>${esc(w.n)}</td><td>${w.ins}</td><td>${w.c}</td><td><span class="tag ${k}">${tx}</span></td></tr>`}).join("")}</table></div>`)}
 <h3>Alumnos inscritos</h3>${card(`<div class="grid"><label>Taller<select data-s="wf"><option value="">Todos</option>${W.map(w=>`<option value="${w.id}"${S.wf==w.id?" selected":""}>${esc(w.n)}</option>`).join("")}</select></label>
 <label>Número de control<input data-live="sq" value="${esc(S.sq)}" placeholder="Busca por número"></label></div>
 <p class="mut">${L.length} alumnos (se muestran 40) <button class="btn sec" data-a="copy">Copiar lista</button></p>
 <div class="tw"><table><tr><th>Control</th><th>Nombre</th><th>Sem.</th><th>Taller</th><th>Horas</th><th>Expediente</th></tr>${L.slice(0,40).map(e=>`<tr><td>${esc(e.c)}</td><td>${esc(e.n)}</td><td>${e.sem}</td><td>${esc(shop(e.t).n)}</td><td>${e.h}</td><td>${medLine(e)}</td></tr>`).join("")}</table></div>`)}`}

function coachBody(s){const h=+S.f.hrs;
 return `<p class="mut">Solo ves a los inscritos de tu taller. La información médica es confidencial.</p><h3>${s.data.length} inscritos</h3>
 ${card(`<div class="tw"><table><tr><th>Asistió</th><th>Nombre</th><th>Teléfono</th><th>Horas</th><th>Expediente</th></tr>${s.data.map(e=>`<tr><td><input type="checkbox" data-att="${esc(e.c)}"${S.att[e.c]?" checked":""} aria-label="Asistió ${esc(e.n)}"></td><td>${esc(e.n)}</td><td>${esc(e.tel)}</td><td>${e.h}${e.h>=S.goal?` <span class="tag">Cumple</span>`:""}</td><td>${e.med?`<span class="tag espera">${medLine(e)}</span>`:"—"}</td></tr>`).join("")}</table></div>`)}
 ${card(`<b>Horas de esta sesión</b><div class="row" style="margin-top:6px">${[1,2,3].map(n=>`<button class="chip" data-a="hours" data-v="${n}" aria-pressed="${h===n}">${n} h</button>`).join("")}<input data-f="hrs" type="number" min="0.25" max="12" step="0.25" value="${esc(S.f.hrs)}" style="width:110px" aria-label="Horas"></div>`)}
 <div class="row"><button class="btn sec" data-a="all">Marcar a todos</button><button class="btn" data-a="session">Registrar sesión</button></div>`}

const MED_FIELDS=[["Control","c"],["Semestre","sem"],["Sexo","x"],["Teléfono","tel"],["Taller(es)","talleres"],["Sangre","sangre"],["Condiciones","cond"],["Alergias","alergias"],["Medicamentos","meds"],["Contacto de emergencia","contacto"],["Observaciones","obs"]];
function doctorBody(s){
 const q=S.sq.trim().toLowerCase(),L=s.data.filter(r=>[r.folio,r.c,r.n].join(" ").toLowerCase().includes(q)),exact=q&&s.data.find(r=>r.folio.toLowerCase()===q);
 let msg;switch(true){
  case!q:msg=`<p class="mut">${s.data.length} expedientes. Escribe un folio, control o nombre.</p>`;break;
  case!!exact:msg=`<div class="note">✔ Folio válido: ${esc(exact.folio)} · ${esc(exact.n)}</div>`;break;
  case L.length>0:msg=`<p class="mut">${L.length} resultado(s). Para verificar un folio escríbelo completo.</p>`;break;
  default:msg='<div class="note bad">✖ No existe expediente con ese dato.</div>'}
 return `<p class="mut">Información confidencial: úsala solo para cuidar al alumno.</p><label>Verificar o buscar<input data-live="sq" value="${esc(S.sq)}" placeholder="Ej.: EXP-0001" autocomplete="off"></label>${msg}
 ${L.slice(0,30).map(r=>card(`<b>${esc(r.n)}</b> <span class="tag">Folio ${esc(r.folio)}</span><dl>${MED_FIELDS.map(([t,k])=>`<dt>${t}</dt><dd>${esc(r[k]||"—")}</dd>`).join("")}</dl>`)).join("")}`}

/* ===== 7. DIBUJO ===== */
const draw=()=>{$("#role").value=S.role;$("#app").innerHTML=(S.role==="alumno"?student:staffView)()};

/* ===== 8. ACCIONES (un solo switch) ===== */
async function act(a,v){switch(a){
 case"retry":return load();
 case"type":S.type=v;break;
 case"gologin":Object.assign(S,{after:"catalog",view:"login",err:{},f:{}});break;
 case"logout":me=null;Object.assign(S,{view:"catalog",pick:null,f:{}});break;
 case"back":Object.assign(S,{view:"catalog",err:{}});break;
 case"pick":S.pick=+v;S.err={};if(me){resetForm();S.view="form"}else Object.assign(S,{after:"form",view:"login",f:{}});break;
 case"mine":S.err={};if(!me){Object.assign(S,{after:"mine",view:"login",f:{}});break}
  {const r=await call("login",{c:me.c,nip:me.nip},"Cargando");if(r.ok){me.p=r.perfil;me.mis=r.mis}resetForm();S.view="mine"}break;
 case"login":return doLogin();
 case"verify":return doVerify();
 case"send":return doSend();
 case"change":return doChange();
 case"saveContact":return doContact();
 case"cert":return doCert(+v);
 case"print":return print();
 case"slogin":return doStaffLogin();
 case"slogout":delete staff[S.role];Object.assign(S,{sq:"",wf:"",f:{hrs:"1"},att:{}});break;
 case"period":{const r=await call("periodo",{clave:staff.jefatura.clave,abierto:!S.open},"Guardando");if(!r.ok)return toast(r.msg||"No se pudo cambiar");await load();toast(S.open?"Periodo abierto":"Periodo cerrado")}break;
 case"copy":{const L=staff.jefatura.data.filter(e=>(!S.wf||e.t==S.wf)&&e.c.includes(S.sq));
  try{await navigator.clipboard.writeText(L.map(e=>[e.c,e.n,e.sem,e.x,e.tel,shop(e.t).n,e.h,e.med?e.med.folio+" "+e.med.cond:""].join("\t")).join("\n"));toast("Lista copiada")}catch(x){toast("No se pudo copiar")}return}
 case"hours":S.f.hrs=v;break;
 case"all":staff.entrenador.data.forEach(e=>S.att[e.c]=true);break;
 case"session":return doSession()}
 draw()}

function resetForm(){const p=me.p;S.f={tel:p.tel||"",sem:p.sem||"",x:p.x||"",exp:p.exp||""};S.err={};S.expMsg=null}
async function doLogin(){const c=(S.f.lc||"").trim(),nip=(S.f.ln||"").trim();
 S.err={};if(!/^\d{8}$/.test(c))S.err.lc="Escribe tu número de control (8 dígitos).";if(!nip)S.err.ln="Escribe tu NIP.";
 if(Object.keys(S.err).length)return draw();
 const r=await call("login",{c,nip},"Verificando");if(!r.ok){S.err={ln:r.msg||"No se pudo entrar."};return draw()}
 me={c,nip,p:r.perfil,mis:r.mis};resetForm();S.view=S.after==="catalog"?"catalog":S.after==="mine"?"mine":"form";draw()}
async function doVerify(){const exp=(S.f.exp||"").trim();
 if(!exp)S.expMsg={ok:false,msg:"Escribe tu número de expediente."};
 else{const r=await call("verexp",{c:me.c,nip:me.nip,exp},"Verificando");S.expMsg=r.ok?{ok:true,msg:`✔ Expediente ${r.exp.folio} verificado: ${r.exp.n}.`}:{ok:false,msg:r.msg}}
 draw()}
async function doSend(){const f=S.f,p=me.p;S.err={};
 if(!phoneOk(f.tel))S.err.tel="Escribe tu teléfono a 10 dígitos.";
 if(!p.sem&&!f.sem)S.err.sem="Elige tu semestre.";if(!p.x&&!f.x)S.err.x="Elige una opción.";
 if(Object.keys(S.err).length)return draw();
 const r=await call("inscribir",{c:me.c,nip:me.nip,t:S.pick,tel:f.tel,sem:f.sem,x:f.x,exp:(f.exp||"").trim()},"Guardando");
 if(r.field==="exp"){S.err.exp=r.msg;return draw()}
 if(!r.ok){toast(r.msg||"No se pudo guardar");S.view="catalog";await load();return draw()}
 me.p=r.perfil;me.mis=r.mis;S.done={t:S.pick,fecha:r.fecha};S.view="done";toast("Inscripción registrada");draw();load()}
async function doChange(){const t=+$("[data-f=chg]").value;
 const r=await call("cambiar",{c:me.c,nip:me.nip,t0:S.done.t,t},"Guardando");
 if(!r.ok){toast(r.msg||"No se pudo cambiar");await load();return draw()}
 me.mis=r.mis;S.done={t,fecha:r.fecha};toast("Cambio registrado");draw();load()}
async function doContact(){const f=S.f;S.err={};if(!phoneOk(f.tel)){S.err.tel="Escribe tu teléfono a 10 dígitos.";return draw()}
 const r=await call("contacto",{c:me.c,nip:me.nip,tel:f.tel,exp:(f.exp||"").trim()},"Guardando");
 if(r.field==="exp"){S.err.exp=r.msg;return draw()}
 if(!r.ok)return toast(r.msg||"No se pudo guardar");
 me.p=r.perfil;resetForm();toast("Datos guardados");draw()}
async function doCert(t){const r=await call("constancia",{c:me.c,nip:me.nip,t},"Generando constancia");
 if(!r.ok)return toast(r.msg||"No se pudo generar");S.cert=r;S.view="cert";draw()}
async function doStaffLogin(){const role=S.role,clave=S.f.key||"",t=+(S.f.t||(W[0]&&W[0].id)||0);
 if(!clave){S.err={key:"Escribe la contraseña."};return draw()}
 const r=await call(STAFF[role].act,{clave,t},"Verificando");if(!r.ok){S.err={key:r.msg||"No se pudo entrar."};return draw()}
 staff[role]={clave,t,data:r.insc||r.regs};S.err={};S.f={hrs:"1"};draw()}
async function doSession(){const s=staff.entrenador,h=Math.round(parseFloat(String(S.f.hrs).replace(",","."))*4)/4;
 if(!(h>=0.25&&h<=12))return toast("Escribe horas entre 0.25 y 12.");
 const who=s.data.filter(e=>S.att[e.c]).map(e=>e.c);if(!who.length)return toast("Marca al menos un alumno.");
 const r=await call("sesion",{t:s.t,clave:s.clave,controles:who,horas:h},"Guardando");if(!r.ok)return toast(r.msg||"No se pudo guardar");
 S.att={};toast(`Sesión de ${h} h registrada para ${who.length} alumnos`);await pullStaff("entrenador");draw()}

/* ===== 9. EVENTOS ===== atributos: data-a acción · data-f campo del formulario · data-s filtro
   · data-live buscador · data-att asistencia · data-enter botón de la tecla Enter */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled&&!S.wait)act(b.dataset.a,b.dataset.v)});
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;
 if(d.f){S.f[d.f]=el.value;if(d.f==="exp")S.expMsg=null}
 if(d.live){S[d.live]=el.value;const at=el.selectionStart;draw();const n=document.querySelector(`[data-live="${d.live}"]`);n.focus();n.setSelectionRange(at,at)}});
document.addEventListener("change",e=>{const el=e.target,d=el.dataset;
 if(d.att){S.att[d.att]=el.checked;return}
 if(d.f){S.f[d.f]=el.value;return}
 if(d.s){if(d.s==="role")Object.assign(S,{role:el.value,view:"catalog",err:{},sq:"",wf:"",f:{hrs:"1"}});else S[d.s]=el.value;draw()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.f){const b=$("[data-enter]");if(b)b.click()}});

/* ===== 10. ARRANQUE ===== */
draw();load();setInterval(load,10000);
</script>
</body>
</html>
